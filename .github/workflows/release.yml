name: Release

# Publishes to PyPI when a version tag is pushed, and NOT otherwise.
#
# The publish job authenticates with an API token in the `PYPI_API_TOKEN`
# secret. That is a step DOWN from Trusted Publishing (OIDC), which this
# workflow used to declare, and the reason is worth writing down so nobody
# "fixes" it back and breaks releases again:
#
#   * The OIDC path never actually worked. No trusted publisher was ever
#     registered on the PyPI side, so every tagged run died at the token
#     exchange with `invalid-publisher`, and every release to date went up
#     by hand with twine. The header claimed a mechanism that was configured
#     on GitHub only.
#   * Registering a publisher is a pypi.org web-UI action, and the account's
#     2FA was lost on 2026-09-04. API tokens keep working when 2FA is lost;
#     the web session does not. So the token is currently the ONLY way for a
#     release to flow from GitHub to PyPI.
#
# Restore Trusted Publishing once the account is recoverable: register the
# publisher (owner/repo/`release.yml`/environment `pypi`), add back
# `permissions: id-token: write` on this job, drop `password:` and the
# secret. Until then this token is a real credential -- it is USER-scoped,
# not project-scoped, so it can publish anything the account owns.
#
# The guards in `scripts/check_release.py` run BEFORE the upload, and each one
# exists because the failure it catches actually shipped:
#   * licensed Hero Games content in the artifact
#   * a dependency floor lower than the version the code needs
#   * the module's __version__ disagreeing with its own metadata
#   * a tag that does not match the built version
# On 2026-08-25 the first release in two days tripped three of the four, all
# found by hand. This is that check, automated.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package and its test deps
        run: pip install -e .[dev]

      - name: Run the test suite
        # Real-character tests skip here by design: they read a corpus path
        # that CI does not have. See tests/corpus.py.
        run: pytest -q --tb=short

      - name: Build the distribution
        run: |
          python -m pip install --upgrade build
          rm -rf dist build *.egg-info
          python -m build

      - name: Release guards
        # Runs from the repo root, which is exactly the case the guard had to
        # be hardened against -- cwd on sys.path made an earlier version
        # validate the working tree instead of the built wheel.
        run: python scripts/check_release.py dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # A release published by hand with twine leaves the tag to be
          # added later; without this the retroactive tag re-uploads a
          # version PyPI already has and the job fails on it.
          skip-existing: true
