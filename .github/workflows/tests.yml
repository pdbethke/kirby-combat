name: Tests

# The publish and cascade jobs that used to live here are gone: they carried
# private-index credentials and a dispatch token, and neither belongs in a
# public repository. What is left is the gate a reader can actually run.
#
# Real-character tests skip here by design — they read KIRBY_COMBAT_BUILDS,
# which is not set in CI and never will be. See tests/corpus.py.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + dev deps
        run: pip install -e .[dev]
      - name: Run tests
        run: pytest -q --tb=short
      # REPLAY PARITY (two-databases spec §6 R1, the Danger Room): every
      # fight the suite runs is rebuilt from its own log after every Phase
      # and must match the fight that ran. A divergence fails the job and
      # names the field and the test (tests/conftest.py). A test that sets
      # state by hand carries @pytest.mark.state_set_by_hand(reason).
      - name: Replay parity sweep
        run: pytest -q --tb=short --replay-parity=replay-parity.jsonl
      - name: Show replay divergences
        if: failure()
        run: cat replay-parity.jsonl || true
