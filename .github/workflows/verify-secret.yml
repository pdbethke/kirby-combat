name: Verify secret (temporary)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Fingerprint the token without revealing it
        env:
          TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          printf 'len=%s\n' "${#TOKEN}"
          printf 'sha256_12=%s\n' "$(printf '%s' "$TOKEN" | sha256sum | cut -c1-12)"
