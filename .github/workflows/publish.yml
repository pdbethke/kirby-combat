name: Test, Publish & Cascade

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + dev deps
        run: pip install -e .[dev]
      - name: Run tests
        run: pytest -q --tb=short

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      # Default GITHUB_TOKEN needs explicit contents:write to push the
      # version-bump commit back to main. Avoids needing a PAT for
      # in-repo writes (PAT is still needed for the cascade dispatch
      # since that crosses repo boundaries — see cascade job).
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Default GITHUB_TOKEN, scoped by the contents:write
          # permissions block above. No PAT needed for the bump-back
          # push.

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Bump version
        id: bump
        env:
          PYPI_PASSWORD: ${{ secrets.PYPI_PRODUCTBINDER_PASSWORD }}
        run: |
          # Bump from max(pyproject.toml, highest-on-PyPI). Same rationale
          # as the dpm workflow: protects against the race where a prior
          # run published to PyPI but failed to git-push the bump back —
          # pyproject.toml would still be behind PyPI and re-publishing
          # would 400 with "already exists".
          CURRENT_LOCAL=$(grep -oP '^version = "\K[^"]+' pyproject.toml)
          PYPI_QUOTED=$(python -c "import os, urllib.parse; print(urllib.parse.quote(os.environ['PYPI_PASSWORD'], safe=''))")
          PYPI_VERSIONS=$(curl -s "https://productbinder:${PYPI_QUOTED}@pypi.productbinder.net/simple/kirby-combat/" \
            | grep -oE 'kirby_combat-[0-9]+\.[0-9]+\.[0-9]+' \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V -u)
          HIGHEST_PYPI=$(echo "$PYPI_VERSIONS" | tail -1)
          echo "pyproject.toml: $CURRENT_LOCAL"
          echo "PyPI latest: ${HIGHEST_PYPI:-none}"
          BASE=$(python -c "cur=tuple(int(x) for x in '$CURRENT_LOCAL'.split('.')); pypi=tuple(int(x) for x in '${HIGHEST_PYPI:-0.0.0}'.split('.')); print('$CURRENT_LOCAL' if cur >= pypi else '${HIGHEST_PYPI:-0.0.0}')")
          NEW=$(python -c "v='$BASE'.split('.'); v[-1]=str(int(v[-1])+1); print('.'.join(v))")
          echo "Bumping $BASE → $NEW (local was $CURRENT_LOCAL)"
          sed -i "s/^version = \"$CURRENT_LOCAL\"/version = \"$NEW\"/" pyproject.toml
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Build wheel + sdist
        run: python -m build --wheel --sdist

      - name: Publish to private PyPI
        env:
          TWINE_USERNAME: productbinder
          TWINE_PASSWORD: ${{ secrets.PYPI_PRODUCTBINDER_PASSWORD }}
        run: twine upload --repository-url https://pypi.productbinder.net/ dist/*

      - name: Commit version bump back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: bump to ${{ steps.bump.outputs.version }} [skip ci]"
          # Rebase onto anything that landed while we were publishing.
          git pull --rebase origin main
          git push origin HEAD:main

  cascade:
    needs: publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The cross-repo dispatch needs a real PAT (the default GITHUB_TOKEN
    # is scoped to its own repo). Without GH_DISPATCH_TOKEN set, this
    # step soft-fails — publish still succeeds; user can manually
    # \`gh workflow run -R pdbethke/kirby-api\` to redeploy with the
    # new wheel, or set GH_DISPATCH_TOKEN to enable auto-cascade.
    continue-on-error: true
    steps:
      - name: Trigger kirby-api redeploy (requires GH_DISPATCH_TOKEN)
        env:
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          NEW_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          if [ -z "${GH_DISPATCH_TOKEN:-}" ]; then
            echo "::warning::GH_DISPATCH_TOKEN secret not set — skipping kirby-api cascade."
            echo "::warning::Manually run: gh workflow run -R pdbethke/kirby-api 'Test & Deploy'"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/pdbethke/kirby-api/dispatches \
            -d "{\"event_type\":\"kirby-combat-updated\",\"client_payload\":{\"version\":\"$NEW_VERSION\"}}"
